
<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>靴裏データ 分析ダッシュボード</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--surface:#1a1f2e;--surface2:#222840;--border:#2a3050;--text:#e8eaf0;--muted:#7a82a0;--dim:#4a5070;--gold:#f0a500;--purple:#a78bfa;--blue:#60a5fa}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.header{background:linear-gradient(135deg,#1a1f3a,#0f1117);padding:20px 16px 16px;border-bottom:1px solid var(--border)}
.header-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.header-icon{font-size:26px}
.header-title{font-size:19px;font-weight:900;background:linear-gradient(90deg,#a78bfa,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.2}
.header-sub{font-size:11px;color:var(--muted);margin-top:2px;font-family:'DM Mono',monospace}
.header-stats{display:flex;gap:8px;flex-wrap:wrap}
.stat-pill{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.stat-pill strong{color:var(--gold);font-size:13px;font-family:'DM Mono',monospace}
.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:16px}
.spinner{width:38px;height:38px;border:3px solid var(--border);border-top-color:#a78bfa;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:var(--muted)}
.error-box{margin:20px 16px;background:#2a1a1a;border:1px solid #aa3333;border-radius:14px;padding:18px}
.error-title{font-size:14px;font-weight:700;color:#ff6666;margin-bottom:6px}
.error-text{font-size:12px;color:var(--muted);line-height:1.7}
.tabs{display:flex;gap:4px;padding:12px 16px 0;border-bottom:1px solid var(--border);overflow-x:auto}
.tab-btn{background:none;border:none;padding:9px 13px;font-family:'Noto Sans JP',sans-serif;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s}
.tab-btn.active{color:var(--text);border-bottom-color:#a78bfa}
.tab-panel{display:none;padding:14px}
.tab-panel.active{display:block}
.sec{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid var(--border);letter-spacing:.05em}

/* パターンバー */
.pbar{display:flex;align-items:center;gap:9px;margin-bottom:10px;background:var(–surface);border-radius:12px;padding:9px 11px;border:1px solid var(–border)}
.pbar-feet{flex-shrink:0;display:flex;gap:4px;align-items:flex-end}
.pbar-foot-col{display:flex;flex-direction:column;align-items:center;gap:2px}
.pbar-label{font-size:8px;color:var(–muted)}
.pbar-info{flex:1;min-width:0}
.pbar-name{font-size:11px;color:var(–muted);margin-bottom:3px}
.pbar-track{height:20px;background:var(–bg);border-radius:5px;overflow:hidden}
.pbar-fill{height:100%;border-radius:5px;display:flex;align-items:center;justify-content:flex-end;padding-right:7px;min-width:34px;transition:width 1s cubic-bezier(.4,0,.2,1)}
.pbar-val{font-size:11px;font-weight:700;color:white;font-family:‘DM Mono’,monospace}
.pbar-pct{font-size:11px;color:var(–muted);font-family:‘DM Mono’,monospace;min-width:30px;text-align:right}

/* 症状バー */
.sbar{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.sbar-name{font-size:12px;min-width:76px;color:var(–text)}
.sbar-track{flex:1;height:19px;background:var(–bg);border-radius:4px;overflow:hidden}
.sbar-fill{height:100%;border-radius:4px;display:flex;align-items:center;justify-content:flex-end;padding-right:5px}
.sbar-val{font-size:10px;font-weight:700;color:white;font-family:‘DM Mono’,monospace}
.sbar-pct{font-size:11px;color:var(–muted);min-width:34px;text-align:right;font-family:‘DM Mono’,monospace}

/* インサイト */
.ins{border-radius:13px;padding:13px 15px;margin-bottom:9px;border:1px solid}
.ins.red{background:#1f1015;border-color:#aa3344}
.ins.blue{background:#101520;border-color:#334488}
.ins.yellow{background:#1a1500;border-color:#886600}
.ins-title{font-size:13px;font-weight:700;margin-bottom:5px}
.ins-text{font-size:12px;color:var(–muted);line-height:1.6}

/* 属性 */
.attr-sec{margin-bottom:18px}
.attr-row{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.attr-lbl{font-size:11px;color:var(–muted);min-width:68px}
.attr-track{flex:1;height:17px;background:var(–bg);border-radius:4px;overflow:hidden}
.attr-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#a78bfa,#60a5fa);display:flex;align-items:center;justify-content:flex-end;padding-right:5px;min-width:22px}
.attr-val{font-size:10px;font-weight:700;color:white;font-family:‘DM Mono’,monospace}
.attr-pct{font-size:10px;color:var(–muted);min-width:34px;text-align:right;font-family:‘DM Mono’,monospace}

/* ヒートマップ */
.hm-wrap{overflow-x:auto}
.hm-table{border-collapse:separate;border-spacing:3px;font-size:10px;min-width:300px}
.hm-table th{font-size:9px;font-weight:600;color:var(–muted);padding:3px;white-space:nowrap;text-align:center}
.hm-table .rl{font-size:9px;font-weight:600;color:var(–text);padding-right:5px;white-space:nowrap;text-align:right}
.hm-table td.cell{width:44px;height:28px;text-align:center;border-radius:5px;font-weight:700;font-size:10px;font-family:‘DM Mono’,monospace}

/* パターン詳細グリッド */
.pd-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pd-card{background:var(–surface);border:1px solid var(–border);border-radius:13px;padding:11px;text-align:center}
.pd-feet{display:flex;justify-content:center;gap:8px;margin-bottom:5px;align-items:flex-end}
.pd-foot-col{display:flex;flex-direction:column;align-items:center;gap:2px}
.pd-fl{font-size:8px;color:var(–muted)}
.pd-name{font-size:10px;font-weight:700;color:var(–text);margin-bottom:2px;line-height:1.3}
.pd-cnt{font-size:21px;font-weight:900;font-family:‘DM Mono’,monospace}
.pd-pct{font-size:10px;color:var(–muted)}

/* 症状カード */
.sym-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.sym-card{background:var(–surface);border:1px solid var(–border);border-radius:13px;padding:13px;text-align:center}
.sym-icon{font-size:20px;margin-bottom:5px}
.sym-lbl{font-size:11px;color:var(–muted);margin-bottom:3px}
.sym-val{font-size:24px;font-weight:900;font-family:‘DM Mono’,monospace}

.refresh-btn{display:flex;align-items:center;gap:6px;margin:0 16px 10px;background:var(–surface2);border:1px solid var(–border);border-radius:10px;padding:9px 16px;font-family:‘Noto Sans JP’,sans-serif;font-size:12px;font-weight:600;color:var(–muted);cursor:pointer;width:calc(100% - 32px);justify-content:center}
.last-upd{text-align:center;font-size:10px;color:var(–dim);padding:6px;font-family:‘DM Mono’,monospace}
.no-data{text-align:center;padding:40px 20px;color:var(–muted);font-size:13px;line-height:2}
</style>

</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="header-icon">👟</div>
    <div>
      <div class="header-title">靴裏データ 分析ダッシュボード</div>
      <div class="header-sub">リアルタイム更新 | フォーム回答データ</div>
    </div>
  </div>
  <div class="header-stats" id="hstats"><div class="stat-pill">読み込み中...</div></div>
</div>

<div id="main"></div>

<script>
// ===== 設定 =====
const SHEET_ID = '1vMdjNFr3UtVLPDprkJ43lX4W1VLuOiOgEgB43dgDC_I';
const SHEET_NAME = 'フォームの回答 1';
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;

const PATTERNS = [
  {name:'①踵外側摩耗',   color:'#e85555',wearPos:'heel-out'   },
  {name:'②踵内側摩耗',   color:'#4a9eff',wearPos:'heel-in'    },
  {name:'⑥左右非対称摩耗',color:'#f0a500',wearPos:'asym'      },
  {name:'④踵中央摩耗',   color:'#f0d000',wearPos:'heel-center'},
  {name:'⑧外側全体摩耗', color:'#ff6eb4',wearPos:'outer-all'  },
  {name:'⑤踵全面摩耗',   color:'#a855f7',wearPos:'heel-full'  },
  {name:'⑨母趾球摩耗',   color:'#22d3a0',wearPos:'ball'       },
  {name:'⑫靴先反り摩耗', color:'#c084fc',wearPos:'toe-tip'    },
  {name:'⑩前足部外側摩耗',color:'#f97316',wearPos:'fore-out'  },
  {name:'③前足部全体摩耗',color:'#4ade80',wearPos:'fore-all'  },
  {name:'⑦内側全体摩耗', color:'#22d3ee',wearPos:'inner-all'  },
  {name:'⑪土踏まず摩耗', color:'#94a3b8',wearPos:'arch'       },
];

const SYMPTOMS = ['腰痛','膝痛','首こり','肩こり','足裏痛','外反母趾'];
const SYM_ICONS = {'腰痛':'🔴','膝痛':'🟠','首こり':'🔵','肩こり':'💜','足裏痛':'🟡','外反母趾':'🟤'};

// ===== 足型SVG =====
// 靴底を下から見た視点（右足基準）
// 右足: 親指=右(x大), 小指=左(x小), かかと=下(y大), つま先=上(y小)
// 左足: transform="translate(W,0) scale(-1,1)" で自動ミラー
// viewBox: 0 0 44 90
function foot(wearPos, isLeft, px) {
  const W=44, H=90;
  const col = PATTERNS.find(p=>p.wearPos===wearPos)?.color||'#e85555';

  // 右足アウトライン
  // 親指側=右(x大で膨らむ), 小指側=左(x小でストレート)
  const sole=`M 22 88 C 12 88 4 80 3 70 C 2 61 4 52 5 44 C 6 37 4 31 7 25 C 9 20 7 14 10 10 C 12 6 16 3 20 3 C 26 3 30 7 31 13 C 32 19 30 26 29 32 C 28 38 27 43 29 47 C 31 51 35 52 38 50 C 41 48 42 44 42 39 C 42 33 41 26 41 20 C 41 14 42 8 44 6 C 45 4 47 5 47 8 C 48 13 46 21 44 29 C 42 37 40 45 40 53 C 40 61 42 69 41 75 C 40 82 33 88 22 88 Z`;

  // 足指（右足: 親指=右側）
  const toes=[
    {cx:18,cy:4, rx:5,  ry:6  }, // 親指（左寄り・大）
    {cx:28,cy:2, rx:4.5,ry:5.5}, // 人差し指
    {cx:36,cy:3, rx:4,  ry:5  }, // 中指
    {cx:42,cy:8, rx:3.5,ry:4.5}, // 薬指
    {cx:46,cy:15,rx:3,  ry:4  }, // 小指（右端・小）
  ].map(t=>`<ellipse cx="${t.cx}" cy="${t.cy}" rx="${t.rx}" ry="${t.ry}" fill="#232a3e" stroke="#3a4a6a" stroke-width="1.2"/>`).join('');

  // 土踏まずライン（内側=右）
  const arch=`<path d="M 38 40 C 40 47 39 55 36 59" stroke="#3a4a6a" stroke-width="1" stroke-dasharray="2,2" fill="none"/>`;

  // 摩耗ゾーン座標（右足基準）
  // 外側=小指側=左(x小), 内側=親指側=右(x大)
  const zones={
    'heel-out':    [{x:2, y:64,w:14,h:20,rx:5}], // かかと外側（小指側=左）
    'heel-in':     [{x:28,y:64,w:14,h:20,rx:5}], // かかと内側（親指側=右）
    'heel-center': [{x:8, y:66,w:26,h:18,rx:7}], // かかと中央
    'heel-full':   [{x:2, y:62,w:40,h:22,rx:9}], // かかと全面
    'outer-all':   [{x:2, y:12,w:10,h:60,rx:4}], // 外側全体（小指側=左）
    'inner-all':   [{x:32,y:12,w:10,h:60,rx:4}], // 内側全体（親指側=右）
    'ball':        [{x:24,y:28,w:17,h:16,rx:6}], // 母趾球（親指付け根=右）
    'fore-all':    [{x:4, y:4, w:36,h:22,rx:7}], // 前足部全体
    'fore-out':    [{x:2, y:5, w:12,h:20,rx:5}], // 前足部外側（小指側=左）
    'toe-tip':     [{x:6, y:0, w:32,h:9, rx:4}], // 靴先
    'arch':        [{x:30,y:38,w:12,h:16,rx:5}], // 土踏まず（内側=右）
    'asym':        [{x:2, y:62,w:14,h:22,rx:5}], // 非対称（右足=外側）
  };

  const rects=(zones[wearPos]||[]).map(z=>
    `<rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" rx="${z.rx}" fill="${col}" opacity="0.92"/>`
  ).join('');

  const scale=px/W;
  const dH=Math.round(H*scale);
  const tr=isLeft?`transform="translate(${W},0) scale(-1,1)"`:'' ;

  return `<svg width="${px}" height="${dH}" viewBox="0 0 ${W} ${H}" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g ${tr}>
    <path d="${sole}" fill="#1e2844" stroke="#3a4a6a" stroke-width="1.8"/>
    ${toes}${arch}${rects}
  </g></svg>`;
}

// ===== CSV =====
function parseCSV(txt){
  const lines=txt.trim().split('\n');
  if(lines.length<2)return[];
  const hds=lines[0].split(',').map(h=>h.replace(/^"|"$/g,'').trim());
  return lines.slice(1).map(line=>{
    const cols=[];let cur='',inQ=false;
    for(let c of line){if(c==='"')inQ=!inQ;else if(c===','&&!inQ){cols.push(cur);cur='';}else cur+=c;}
    cols.push(cur);
    const row={};hds.forEach((h,i)=>row[h]=(cols[i]||'').trim());
    return row;
  });
}

// ===== 分析 =====
function analyze(rows){
  const total=rows.length;
  const wc={};PATTERNS.forEach(p=>wc[p.name]=0);
  const sc={};SYMPTOMS.forEach(s=>sc[s]=0);
  const ws={};PATTERNS.forEach(p=>{ws[p.name]={};SYMPTOMS.forEach(s=>ws[p.name][s]=0);});
  const ac={},gc={},shc={};

  rows.forEach(row=>{
    const wk=Object.keys(row).find(k=>k.includes('摩耗パターン'));
    const sk=Object.keys(row).find(k=>k.includes('現在ある症状')&&!k.includes('その他'));
    const ak=Object.keys(row).find(k=>k.includes('年齢'));
    const gk=Object.keys(row).find(k=>k.includes('性別'));
    const shk=Object.keys(row).find(k=>k.includes('靴の種類'));
    const wear=wk?row[wk]:'', syms=sk?row[sk]:'';
    const age=ak?row[ak]:'', gender=gk?row[gk]:'', shoe=shk?row[shk]:'';
    if(wear&&wc[wear]!==undefined)wc[wear]++;
    SYMPTOMS.forEach(s=>{if(syms.includes(s)){sc[s]++;if(wear&&ws[wear])ws[wear][s]++;}});
    if(age)ac[age]=(ac[age]||0)+1;
    if(gender)gc[gender]=(gc[gender]||0)+1;
    if(shoe)shc[shoe]=(shc[shoe]||0)+1;
  });
  return{total,wc,sc,ws,ac,gc,shc};
}

function heatCol(v){
  if(!v)return'var(--surface)';
  const i=v/100;
  return`rgba(${Math.round(20+200*i)},${Math.round(30+30*(1-i))},${Math.round(60+20*(1-i))},.85)`;
}

// ===== レンダリング =====
function render(d){
  const{total,wc,sc,ws,ac,gc,shc}=d;
  document.getElementById('hstats').innerHTML=`
    <div class="stat-pill">総回答数 <strong>${total}</strong> 件</div>
    <div class="stat-pill">摩耗パターン <strong>12</strong> 種類</div>`;

  const sorted=[...PATTERNS].sort((a,b)=>(wc[b.name]||0)-(wc[a.name]||0));
  const mxW=Math.max(...sorted.map(p=>wc[p.name]||0),1);
  const mxS=Math.max(...SYMPTOMS.map(s=>sc[s]||0),1);

  const feetHTML=(p,sz)=>`
    <div class="pbar-foot-col"><div class="pbar-label">左</div>${foot(p.wearPos,true,sz)}</div>
    <div class="pbar-foot-col"><div class="pbar-label">右</div>${foot(p.wearPos,false,sz)}</div>`;

  document.getElementById('main').innerHTML=`
  <button class="refresh-btn" onclick="loadData()">🔄 データを更新する</button>
  <div class="tabs">
    <button class="tab-btn active" onclick="sw('overview',this)">📊 概要</button>
    <button class="tab-btn" onclick="sw('patterns',this)">👟 摩耗</button>
    <button class="tab-btn" onclick="sw('symptoms',this)">🩺 症状</button>
    <button class="tab-btn" onclick="sw('attr',this)">👤 属性</button>
    <button class="tab-btn" onclick="sw('matrix',this)">🔥 マトリクス</button>
  </div>

  <!-- 概要 -->
  <div id="tab-overview" class="tab-panel active">
    ${total===0?`<div class="no-data">📋 まだ回答データがありません<br>フォームへの回答が集まると<br>自動でグラフに反映されます</div>`:`
    <div class="sec">📊 摩耗パターン分布（上位5件）</div>
    ${sorted.slice(0,5).map(p=>`
    <div class="pbar">
      <div class="pbar-feet">${feetHTML(p,20)}</div>
      <div class="pbar-info">
        <div class="pbar-name">${p.name}</div>
        <div class="pbar-track"><div class="pbar-fill" style="width:${Math.round((wc[p.name]||0)/mxW*100)}%;background:${p.color}"><span class="pbar-val">${wc[p.name]||0}件</span></div></div>
      </div>
      <div class="pbar-pct">${Math.round((wc[p.name]||0)/total*100)}%</div>
    </div>`).join('')}
    <div class="sec" style="margin-top:18px">🩺 症状出現頻度</div>
    ${SYMPTOMS.map(s=>`
    <div class="sbar">
      <div class="sbar-name">${SYM_ICONS[s]||''} ${s}</div>
      <div class="sbar-track"><div class="sbar-fill" style="width:${Math.round((sc[s]||0)/mxS*100)}%;background:linear-gradient(90deg,#a78bfa,#60a5fa)"><span class="sbar-val">${sc[s]||0}</span></div></div>
      <div class="sbar-pct">${Math.round((sc[s]||0)/total*100)}%</div>
    </div>`).join('')}
    <div class="sec" style="margin-top:18px">💡 インサイト</div>
    ${insightHTML(sorted,wc,sc,total)}`}
  </div>

  <!-- 摩耗パターン -->
  <div id="tab-patterns" class="tab-panel">
    <div class="sec">全摩耗パターン一覧</div>
    ${total===0?`<div class="no-data">回答データなし</div>`:`
    <div class="pd-grid">
      ${sorted.map(p=>`
      <div class="pd-card" style="border-top:3px solid ${p.color}">
        <div class="pd-feet">
          <div class="pd-foot-col"><div class="pd-fl">左</div>${foot(p.wearPos,true,32)}</div>
          <div class="pd-foot-col"><div class="pd-fl">右</div>${foot(p.wearPos,false,32)}</div>
        </div>
        <div class="pd-name">${p.name}</div>
        <div class="pd-cnt" style="color:${p.color}">${wc[p.name]||0}</div>
        <div class="pd-pct">${Math.round((wc[p.name]||0)/total*100)}% (${wc[p.name]||0}件)</div>
      </div>`).join('')}
    </div>`}
  </div>

  <!-- 症状 -->
  <div id="tab-symptoms" class="tab-panel">
    <div class="sec">症状別 件数</div>
    ${total===0?`<div class="no-data">回答データなし</div>`:`
    <div class="sym-grid">
      ${SYMPTOMS.map(s=>`
      <div class="sym-card">
        <div class="sym-icon">${SYM_ICONS[s]||'🔵'}</div>
        <div class="sym-lbl">${s}</div>
        <div class="sym-val">${sc[s]||0}</div>
      </div>`).join('')}
    </div>`}
  </div>

  <!-- 属性 -->
  <div id="tab-attr" class="tab-panel">
    ${total===0?`<div class="no-data">回答データなし</div>`:`
    <div class="attr-sec">
      <div class="sec">年齢分布</div>
      ${Object.entries(ac).sort().map(([k,v])=>`
      <div class="attr-row"><div class="attr-lbl">${k}</div>
      <div class="attr-track"><div class="attr-fill" style="width:${Math.round(v/total*100)}%"><span class="attr-val">${v}</span></div></div>
      <div class="attr-pct">${Math.round(v/total*100)}%</div></div>`).join('')}
    </div>
    <div class="attr-sec">
      <div class="sec">性別分布</div>
      ${Object.entries(gc).map(([k,v])=>`
      <div class="attr-row"><div class="attr-lbl">${k}</div>
      <div class="attr-track"><div class="attr-fill" style="width:${Math.round(v/total*100)}%"><span class="attr-val">${v}</span></div></div>
      <div class="attr-pct">${Math.round(v/total*100)}%</div></div>`).join('')}
    </div>
    <div class="attr-sec">
      <div class="sec">靴の種類</div>
      ${Object.entries(shc).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`
      <div class="attr-row"><div class="attr-lbl">${k}</div>
      <div class="attr-track"><div class="attr-fill" style="width:${Math.round(v/total*100)}%"><span class="attr-val">${v}</span></div></div>
      <div class="attr-pct">${Math.round(v/total*100)}%</div></div>`).join('')}
    </div>`}
  </div>

  <!-- マトリクス -->
  <div id="tab-matrix" class="tab-panel">
    <div class="sec">摩耗パターン × 症状 関連性（%）</div>
    ${total===0?`<div class="no-data">回答データなし</div>`:`
    <div class="hm-wrap">
      <table class="hm-table">
        <thead><tr><th></th>${SYMPTOMS.map(s=>`<th>${s}</th>`).join('')}</tr></thead>
        <tbody>${sorted.map(p=>{
          const cnt=wc[p.name]||0;
          return`<tr><td class="rl">${p.name.substring(0,5)}</td>
          ${SYMPTOMS.map(s=>{
            const v=cnt>0?Math.round((ws[p.name][s]||0)/cnt*100):0;
            return`<td class="cell" style="background:${heatCol(v)};color:${v>50?'white':'var(--muted)'}">${v>0?v+'%':''}</td>`;
          }).join('')}</tr>`;
        }).join('')}</tbody>
      </table>
    </div>
    <div style="margin-top:9px;font-size:10px;color:var(--dim)">※ 各セルは「そのパターンの回答者のうち該当症状を持つ割合」</div>`}
  </div>

  <div class="last-upd" id="lupd"></div>`;

  document.getElementById('lupd').textContent='最終更新: '+new Date().toLocaleString('ja-JP');
}

function insightHTML(sorted,wc,sc,total){
  if(!total)return'';
  const top=sorted[0];
  const topPct=Math.round((wc[top.name]||0)/total*100);
  const topSym=Object.entries(sc).sort((a,b)=>b[1]-a[1])[0];
  const avg=(Object.values(sc).reduce((s,v)=>s+v,0)/total).toFixed(1);
  return`
  <div class="ins red"><div class="ins-title">🏆 最多摩耗パターン</div><div class="ins-text">${top.name}が全体の${topPct}%（${wc[top.name]||0}件）を占めます。</div></div>
  <div class="ins blue"><div class="ins-title">🔴 最多症状</div><div class="ins-text">${topSym[0]}が${topSym[1]}件（${Math.round(topSym[1]/total*100)}%）と最多です。</div></div>
  <div class="ins yellow"><div class="ins-title">💡 平均症状数</div><div class="ins-text">1人あたり平均<strong>${avg}種類</strong>の症状があります。</div></div>`;
}

function sw(id,btn){
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  btn.classList.add('active');
}

async function loadData(){
  document.getElementById('main').innerHTML=`<div class="loading-wrap"><div class="spinner"></div><div class="loading-text">データ取得中...</div></div>`;
  try{
    const res=await fetch(CSV_URL);
    if(!res.ok)throw new Error(`HTTP ${res.status}`);
    const txt=await res.text();
    render(analyze(parseCSV(txt)));
  }catch(e){
    document.getElementById('main').innerHTML=`
    <div class="error-box">
      <div class="error-title">⚠️ データ取得に失敗しました</div>
      <div class="error-text">スプレッドシートの公開設定を確認してください。<br>エラー: ${e.message}</div>
    </div>
    <button class="refresh-btn" onclick="loadData()" style="margin-top:8px">🔄 再試行する</button>`;
  }
}

loadData();
</script>

</body>
</html>
